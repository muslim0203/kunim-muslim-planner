# KUNIM — production stack.
#
# NOT executed on the machine that authored this file: Docker is not
# installed here (see infra/README.md). Validated only by parsing it as
# YAML with a throwaway Node script — never run through
# `docker compose config` or an actual deploy.
#
# DESIGN NOTE: this file is a full, STANDALONE stack definition, not a
# partial "-f docker-compose.yml -f docker-compose.prod.yml" overlay of the
# dev file. Compose's merge rules for list-valued keys (ports, volumes) are
# additive/version-dependent (the `!reset`/`!override` merge tags that make
# "un-publish this port" possible only work on Compose Specification
# implementations recent enough to support them), and that could not be
# verified on this machine. A standalone file avoids that ambiguity
# entirely: what you read here is exactly what runs.
#
# Deploy with:
#   docker compose -f infra/docker-compose.prod.yml --env-file .env up -d
#
# SECRETS: every value below is `${VAR}`, resolved from the deployment
# environment (the host's real environment, a systemd EnvironmentFile, or
# your platform's secret store) — never from a committed file. `.env` is
# gitignored (see .env.example) and must never be baked into an image or
# pushed to the deploy host as part of this repo's contents.

x-api-env: &api-env
  ENV: prod
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  JWT_SECRET: ${JWT_SECRET}
  FIELD_ENC_KEY: ${FIELD_ENC_KEY}

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # No published port: reachable only from other containers on this
    # compose network, by service name (`postgres:5432`).
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Resource limits (uncomment and tune for the target host; requires
    # `docker compose` with a Swarm-less "deploy.resources" backport, or
    # run under Swarm/Kubernetes where `deploy:` is honored natively):
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "2"
    #       memory: 2g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # No published port: internal only, reachable as `redis:6379`.
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "0.5"
    #       memory: 512m

  minio:
    image: quay.io/minio/minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    # Console (9001) and S3 API (9000) are NOT published here either;
    # reach the console over an SSH tunnel, or front it with Caddy on a
    # separate admin-only route if remote access is ever required.
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
      mc anonymous set none local/\"$$S3_BUCKET\"
      "

  api:
    build:
      context: ../
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
    # No source bind-mount (the image is self-contained) and no --reload:
    # this is the built image's default CMD (see infra/api.Dockerfile), not
    # overridden here.
    # No published port: only Caddy talks to `api:8000` on the compose
    # network.
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1"
    #       memory: 1g

  worker:
    build:
      context: ../
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      <<: *api-env
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    healthcheck:
      test: ["CMD", "arq", "--check", "app.jobs.worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # deploy:
    #   resources:
    #     limits:
    #       cpus: "1"
    #       memory: 1g

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:
