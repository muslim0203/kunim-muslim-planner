[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kunim-api"
version = "0.1.0"
description = "KUNIM (Muslim Planner) backend API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "alembic",
    "pydantic",
    "email-validator",  # required by pydantic EmailStr (auth schemas)
    "pydantic-settings",
    "pyjwt",
    "argon2-cffi",
    "httpx",
    "redis",
    "arq",
    "structlog",
    "sqladmin",
    "jinja2",
    # Required for `zoneinfo.ZoneInfo` (profile/preferences timezone
    # validation, app/modules/profile, app/modules/preferences) to resolve
    # IANA zones on systems with no OS-level tz database -- notably Windows,
    # and some minimal Linux container images. Harmless where the system
    # database already exists.
    "tzdata",
    # AES-256-GCM for `EncryptedText` note columns (app/db/types.py).
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "anyio",
    "aiosqlite",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
