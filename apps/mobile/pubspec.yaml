# versions pinned on first `flutter pub get` — not yet run (Flutter not installed)
# Caret ranges below are plausible for Flutter 3.22 / Dart 3.4 at time of writing;
# they will be resolved (and this file rewritten by `flutter pub get`/`pub upgrade`)
# once Flutter is installed on a build machine. Do not treat these as verified.
name: kunim
description: KUNIM — Muslim lifestyle, time and self-development assistant.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management (ADR-001)
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing
  go_router: ^18.0.1

  # Local DB (offline-first source of truth)
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  sqlcipher_flutter_libs: ^0.7.0+eol

  # Immutable models / DTOs
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # HTTP
  dio: ^5.4.3+1
  dio_smart_retry: ^7.0.1

  # i18n
  intl: ^0.20.3

  # Secure storage (refresh token, DB key — Phase 1)
  flutter_secure_storage: ^11.1.1

  # Prayer times (offline calculation)
  adhan_dart: ^2.0.1

  # Notifications (zoned local scheduling for prayer/task reminders)
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

  # Misc utilities used from Phase 0
  uuid: ^4.4.0
  connectivity_plus: ^7.3.1
  package_info_plus: ^10.2.1
  path_provider: ^2.1.3
  flutter_svg: ^2.0.10+1

  # --- Phase 1 (auth / account) ---
  # Google sign-in (core/auth/google_sign_in_client.dart)
  google_sign_in: ^7.2.0
  # sign_in_with_apple         # Phase 1 — auth
  # share_plus                 # Phase 1+ — as needed
  # url_launcher               # Phase 1+ — as needed

  # --- Phase 3 (prayer/Quran depth, geo, audio) ---
  # geolocator                 # Phase 3 — one-time location
  # geocoding                  # Phase 3
  # just_audio                 # Phase 3 — Quran audio
  # just_audio_background      # Phase 3
  # flutter_cache_manager      # Phase 3 — Quran audio LRU cache

  # --- Phase 6 (Digital Wellbeing / native bridge) ---
  # workmanager                # Phase 6 — Android DW aggregation
  # pigeon (dev)               # Phase 6 — native bridge (UsageStats / Screen Time)

  # --- Phase 8 (push) ---
  # firebase_core              # Phase 8 — push
  # firebase_messaging         # Phase 8 — push (iOS via APNs)

  # --- Phase 9 (observability, charts) ---
  # posthog_flutter            # Phase 9 — analytics
  # sentry_flutter             # Phase 9 — crash reporting
  # fl_chart                   # Phase 5 — statistics charts

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.9
  riverpod_generator: ^4.0.0+1
  drift_dev: ^2.18.0
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  # Used directly (not just transitively via drift) by
  # test/db/migration_test.dart to hand-build a pre-migration database.
  sqlite3: ^2.9.0

  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3

flutter:
  generate: true
  uses-material-design: true

  # `assets/` only holds a `.gitkeep` placeholder in Phase 0 (no real asset
  # files exist yet — e.g. assets/db/quran.sqlite and assets/cities.json
  # land in Phase 3). Declaring the directory now means later phases can
  # drop files straight into it without touching this file again.
  assets:
    - assets/
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-VariableFont_wght.ttf

# l10n code generation is driven by `l10n.yaml` (arb-dir/template/output
# class/dir). `generate: true` above is what makes `flutter gen-l10n` run
# automatically as part of `flutter pub get` / `flutter build`.
