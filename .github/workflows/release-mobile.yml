# Signed Android release build. Separate from `Mobile` CI on purpose: that one
# must stay green on every push, while this one needs the four signing secrets
# and only runs when a release is actually cut.
#
# Secrets (Settings -> Secrets and variables -> Actions), see
# docs/release-android.md:
#   ANDROID_KEYSTORE_BASE64  ANDROID_STORE_PASSWORD
#   ANDROID_KEY_ALIAS        ANDROID_KEY_PASSWORD
name: Release (Android)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
        working-directory: apps/mobile
      # Generated sources (*.g.dart, l10n) are gitignored -- same as in the
      # Mobile workflow, they have to be produced before anything compiles.
      - run: dart run build_runner build --delete-conflicting-outputs
        working-directory: apps/mobile
      - run: flutter gen-l10n
        working-directory: apps/mobile
      - run: flutter test
        working-directory: apps/mobile

      - name: Restore the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set -- see docs/release-android.md" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build the app bundle
        working-directory: apps/mobile
        env:
          KUNIM_ANDROID_KEYSTORE: ${{ runner.temp }}/upload.jks
          KUNIM_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KUNIM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KUNIM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      # The signer would otherwise leave the key on the runner's disk for the
      # rest of the job, including any step added later.
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: kunim-release-aab
          path: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
