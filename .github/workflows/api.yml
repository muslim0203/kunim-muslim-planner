name: API

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'apps/api/**'
      - '.github/workflows/api.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kunim
          POSTGRES_PASSWORD: kunim
          POSTGRES_DB: kunim
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://kunim:kunim@localhost:5432/kunim
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-test-secret-not-real
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e "apps/api[dev]"
      - run: ruff check apps/api
      - run: ruff format --check apps/api
      - run: alembic upgrade head
        working-directory: apps/api
      - run: pytest apps/api/tests -q
